# 开发环境依赖：MySQL 8（可选 admin-web）。仅用于本地开发，勿用于生产。
# 用法：
#   docker compose -f deploy/docker-compose.dev.yml up -d mysql
#   （凭据来自同目录 .env，未提供时用下方默认值；与 README 快速开始一致）
services:
  mysql:
    image: mysql:8.0
    container_name: clf-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me_in_local_only}
      MYSQL_DATABASE: ${DB_NAME:-campus_lost_found}
    ports:
      - "${DB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - clf-mysql-data:/var/lib/mysql
      # 首启自动创建隔离测试库（与 README 一致：campus_lost_found + campus_lost_found_test）
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change_me_in_local_only}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 可选：构建并运行管理后台（需要已构建的后端在宿主机 8080；默认不随 up 启动）
  admin-web:
    image: node:20-alpine
    container_name: clf-admin-web-dev
    profiles: ["admin"]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../apps/admin-web:/app

volumes:
  clf-mysql-data:
