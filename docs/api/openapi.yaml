openapi: 3.0.3
info:
  title: 校园失物招领系统 API
  version: 0.2.0
  description: 终审整改契约：与Controller method+path及实际HTTP行为对应；所有JSON成功为200且含ApiEnvelope，文件下载例外。时间UTC带Z；ID为int64数值。动态文件权限、受理授权见conventions。运行期springdoc用于交叉检查，不能替代此处业务契约。
servers:
- url: /api/v1
  description: 统一前缀
tags:
- name: M1-Auth
- name: M1-User
- name: M3-Post
- name: M3-File
