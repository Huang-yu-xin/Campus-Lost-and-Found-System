  /files:
    post:
      tags:
      - M3-File
      summary: 上传文件（FR-FILE-01）
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum:
                  - PUBLIC_POST
                  - PRIVATE_CLAIM
                  - PRIVATE_DISPUTE
                  - PRIVATE_LEAD
      responses:
        '413':
          description: FILE_TOO_LARGE
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
        '200':
          description: OK；统一响应封装
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
