spring:
  application:
    name: campus-lost-found-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # 略大于业务值 FILE_MAX_SIZE_MB(5MB)，让 FileService 的 5MB 校验先行返回 FILE_TOO_LARGE，
      # 而非在 Spring 层抛 MaxUploadSizeExceededException（P0-1）
      max-file-size: ${FILE_SPRING_MAX_SIZE:6MB}
      max-request-size: ${FILE_SPRING_MAX_REQUEST:10MB}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campus_lost_found}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# API 前缀 /api/v1
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: edu.whut.clf
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs

# 应用级配置（默认值见 deploy/env.example；真实机密放 application-local.yml）
app:
  auth:
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:120}
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me}
  mock-login:
    enabled: ${MOCK_LOGIN_ENABLED:false}
  campus-identity:
    provider: ${CAMPUS_IDENTITY_PROVIDER:disabled}
  wechat:
    appid: ${WECHAT_APPID:}
    appsecret: ${WECHAT_APPSECRET:}
  file:
    storage-root: ${FILE_STORAGE_ROOT:./storage}
    max-size-mb: ${FILE_MAX_SIZE_MB:5}
    max-count-per-post: ${FILE_MAX_COUNT_PER_POST:6}
    allowed-mime: ${FILE_ALLOWED_MIME:image/jpeg,image/png,image/webp}
    orphan-cleanup-enabled: ${FILE_ORPHAN_CLEANUP:true}
  backup:
    dir: ${APP_BACKUP_DIR:./backups}
  # 匹配权重与阈值：默认值与 AppProperties.Match 完全一致，仅做外部可覆盖（不改默认，不动打分公式）。
  match:
    w-category: ${MATCH_W_CATEGORY:0.40}
    w-location: ${MATCH_W_LOCATION:0.25}
    w-time: ${MATCH_W_TIME:0.30}
    w-keyword: ${MATCH_W_KEYWORD:0.05}
    time-window-days: ${MATCH_TIME_WINDOW_DAYS:14}
    time-tolerance-hours: ${MATCH_TIME_TOLERANCE_HOURS:24}
    max-candidates: ${MATCH_MAX_CANDIDATES:20}
    min-score: ${MATCH_MIN_SCORE:0.70}
    null-event-window-days: ${NULL_EVENT_WINDOW_DAYS:60}
    candidate-arm-limit: ${CANDIDATE_ARM_LIMIT:500}
    same-parent-score: ${SAME_PARENT_SCORE:0.5}
    category-window-days: ${CATEGORY_WINDOW_DAYS:90}
    w-unigram: ${W_UNIGRAM:0.5}
    w-bigram: ${W_BIGRAM:0.5}
    campus-mismatch-factor: ${CAMPUS_MISMATCH_FACTOR:0.3}

logging:
  level:
    root: INFO
    edu.whut.clf: DEBUG
