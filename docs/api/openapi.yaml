                  properties:
                    data:
                      $ref: '#/components/schemas/Health'
        '400':
          description: 参数格式或业务校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '403':
          description: 角色或账户受限
