  /claims/{claimId}/resolve-lost:
    post:
      tags:
      - M5-Claim
      summary: 失主确认将寻物帖关联为"已找回"（FR-POST-06）
      description: '把申请人名下的一条 LOST 帖闭环为 COMPLETED 并回填 resolved_by_claim_id。 校验顺序即防枚举：参与方 → claim 完成 → 只能关联 LOST
        帖 → 帖子归属 → 幂等/冲突 → 类别一致。 一个 claim 只能关联一条寻物帖（裁决 R4）。

        '
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveLostRequest'
      responses:
        '200':
          description: OK；统一响应封装
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
                      description: 该操作data为null
        '400':
          description: INVALID_ARGUMENT（lostPostId 缺失/非 LOST 帖）/ RESOLVE_CATEGORY_MISMATCH
        '403':
          description: RESOLVE_NOT_OWNER
        '404':
          description: CLAIM_NOT_FOUND（含非申请人防枚举）/ POST_NOT_FOUND
        '409':
          description: CLAIM_NOT_COMPLETED / RESOLVE_ALREADY_RESOLVED
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
